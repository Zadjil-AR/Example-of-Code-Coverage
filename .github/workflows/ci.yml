name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Cancel redundant runs on the same ref
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      # Log the commit hash of code-coverage-report-action being used
      - name: Log code-coverage-report-action commit hash
        run: |
          echo "Fetching commit hash for Zadjil-AR/code-coverage-report-action@copilot/feat-report-line-coverage-loss"
          COMMIT_HASH=$(git ls-remote https://github.com/Zadjil-AR/code-coverage-report-action.git refs/heads/copilot/feat-report-line-coverage-loss | cut -f1)
          echo "Using code-coverage-report-action commit: $COMMIT_HASH"

      # Use the latest code from Zadjil-AR/code-coverage-report-action PR #5
      # (branch: copilot/feat-report-line-coverage-loss)
      - name: Code Coverage Report
        uses: Zadjil-AR/code-coverage-report-action@5ba0af0074a53a5c09b0e01a36412d7d547bae61 
        id: code_coverage
        if: ${{ github.actor != 'dependabot[bot]' }}
        with:
          filename: 'coverage/clover.xml'
          badge: 'true'
          fail_on_negative_difference: false
          artifact_download_workflow_names: 'CI'
          track_lost_lines: 'true'

      # Post coverage results as a sticky comment on pull requests
      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: >
          steps.code_coverage.outputs.file != '' &&
          github.event_name == 'pull_request' &&
          (success() || failure())
        with:
          recreate: true
          path: code-coverage-results.md

      # Update the README badge JSON on pushes to main
      - name: Update coverage badge
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.code_coverage.outputs.coverage != ''
        env:
          COVERAGE: ${{ steps.code_coverage.outputs.coverage }}
        run: |
          # Determine badge colour
          if awk "BEGIN {exit !($COVERAGE >= 80)}"; then
            COLOR="brightgreen"
          elif awk "BEGIN {exit !($COVERAGE >= 60)}"; then
            COLOR="yellow"
          else
            COLOR="red"
          fi

          # Write shields.io endpoint JSON
          cat > .github/badges/coverage.json <<EOF
          {
            "schemaVersion": 1,
            "label": "coverage",
            "message": "${COVERAGE}%",
            "color": "${COLOR}"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.json
          git diff --staged --quiet || \
            git commit -m "chore: update coverage badge to ${COVERAGE}% [skip ci]"
          git push
